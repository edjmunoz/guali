# Integración continua: compila y prueba los dos microservicios en cada push.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar y probar
        run: mvn -B verify
      - name: Construir imágenes Docker
        run: docker compose --env-file .env.example build
