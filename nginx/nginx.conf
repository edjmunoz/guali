# Nginx como reverse proxy con seguridad integrada:
#  - Limita peticiones por IP (mitiga fuerza bruta y DoS de capa 7)
#  - Limita conexiones simultáneas y tamaño de subida
#  - Oculta versión y agrega encabezados de seguridad
#  - Solo publica guali-web; el compilador y MariaDB no son accesibles desde fuera
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 30s;

    # IP real del visitante cuando el tráfico llega a través de CloudFront (CDN de AWS).
    # CloudFront agrega la IP del cliente al encabezado X-Forwarded-For.
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    set_real_ip_from  0.0.0.0/0;

    # https si CloudFront lo indica; si no, el esquema de esta conexión
    map $http_cloudfront_forwarded_proto $proto_original {
        default $http_cloudfront_forwarded_proto;
        ""      $scheme;
    }

    # ---------- Límites (por IP) ----------
    limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=codigo:10m  rate=2r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m   rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conexiones:10m;
    limit_req_status  429;
    limit_conn_status 429;

    client_max_body_size   25m;
    client_body_timeout    15s;
    client_header_timeout  15s;
    send_timeout           30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream guali_web {
        server guali-web:8080;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        limit_conn conexiones 30;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_original;
        proxy_read_timeout 120s;

        # Compilar / ejecutar: lo más costoso del sistema
        location /api/codigo/ {
            limit_req zone=codigo burst=4 nodelay;
            proxy_pass http://guali_web;
        }

        # Inicio de sesión: evita ataques de fuerza bruta
        location = /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://guali_web;
        }

        # Solo el health check del actuator es público
        location /actuator/ {
            location = /actuator/health { proxy_pass http://guali_web; }
            return 404;
        }

        # Archivos estáticos: caché en el navegador / CDN
        location ~* ^/(css|js|img)/ {
            limit_req zone=general burst=60 nodelay;
            expires 1h;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            proxy_pass http://guali_web;
        }

        location / {
            limit_req zone=general burst=40 nodelay;
            proxy_pass http://guali_web;
        }
    }
}
