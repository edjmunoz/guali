spring.application.name=guali-web
server.port=${PORT:8080}

# ---------- Base de datos MariaDB ----------
# Valores por defecto = MariaDB de XAMPP en tu computadora (puerto 3307, usuario root sin clave).
# En el servidor (Docker) se reemplazan con las variables GUALI_DB_*.
spring.datasource.url=${GUALI_DB_URL:jdbc:mariadb://localhost:3307/guali_db?createDatabaseIfNotExist=true}
spring.datasource.username=${GUALI_DB_USER:root}
spring.datasource.password=${GUALI_DB_PASSWORD:}
# Hibernate crea/actualiza las tablas a partir de las entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- Archivos (importar bundle .zip) ----------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ---------- Microservicio de compilación ----------
guali.compilador.url=${GUALI_COMPILADOR_URL:http://localhost:8081}
guali.compilador.token=${GUALI_TOKEN_INTERNO:}

# ---------- Administrador inicial (solo se crea si no hay usuarios) ----------
guali.admin.usuario=${GUALI_ADMIN_USUARIO:admin}
guali.admin.password=${GUALI_ADMIN_PASSWORD:Admin123!}

# ---------- Otros ----------
guali.zona-horaria=America/Guatemala
# Importa lecciones de ejemplo al iniciar si la base está vacía
guali.lecciones-ejemplo=true

# Detrás de Nginx / Cloudflare: respetar X-Forwarded-Proto, X-Forwarded-For
server.forward-headers-strategy=framework
# Redirecciones relativas: funcionan detrás de CloudFront sin importar el dominio de origen
server.tomcat.use-relative-redirects=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.error.include-message=always

management.endpoints.web.exposure.include=health
