spring.application.name=guali-compiler
server.port=${PORT:8081}

# Ruta del JDK 25 que usará guali-dev para javac/java.
# Si se deja vacío se usa el JDK con el que corre este servicio (java.home).
guali.jdk-home=${GUALI_JDK_HOME:}
guali.timeout-segundos=${GUALI_TIMEOUT:10}
guali.max-caracteres-salida=20000

# Token compartido con guali-web. Si está vacío no se valida (solo desarrollo local).
guali.token-interno=${GUALI_TOKEN_INTERNO:}

management.endpoints.web.exposure.include=health
